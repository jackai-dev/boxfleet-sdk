openapi: 3.1.0
info:
  title: BoxFleet
  version: 0.3.0
  summary: Provider-neutral local Firecracker, 25 cloud/GPU sandbox bridges, White-Label Serverless MicroVM Cloud, and JackAISaaS Connect Fleet Governance API.
  description: |
    Official OpenAPI 3.1 specification for **BoxFleet** (`boxfleet` / `boxfleek` / `jackai-box`), generated and verified with **OmniWrap** for the `jackai-dev` ecosystem.

    BoxFleet unifies:
    - **Local Firecracker & WSL2 microVMs** with host-side model relay and zero guest credentials.
    - **25 Cloud & GPU Sandbox Providers** (`e2b`, `lambda`, `runpod`, `daytona`, `modal`, `beam`, `fly-machines`, `cloudflare-sandbox`, `koyeb`, `morph`, `blaxel`, `sprites`, `northflank`, `together`, `replicate`, `baseten`, `fal`, `fireworks`, `codesandbox`, `railway`, `render`, `hetzner`, `digitalocean`, `vultr`, `linode`, `instabox`, `molted`).
    - **BoxFleet Managed White-Label Cloud (`boxfleet-cloud`)**: Zero-idle-cost ($0/hr when suspended) instant microVMs, X11/noVNC `:1` GUI desktop streaming, serverless H100/A100/L4 GPUs, `tmpfs` `/run/boxfleet/vault` secret injection, and wake-on-HTTP preview URLs (`https://{port}-{boxId}.preview.boxfleet.io`).
    - **JackAISaaS Connect Multi-Tenant SaaS & Business/Enterprise Fleet Governance**: 5 tiers (`free`, `pro`, `team`, `business`, `enterprise`), RBAC seats, per-member box quotas, and live park control.
  contact:
    name: JackAI Dev (BoxFleet & OmniWrap)
    url: https://github.com/orgs/jackai-dev
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://boxfleet.io
    description: BoxFleet Managed Cloud & SaaS Control Plane (Cloudflare Edge)
  - url: http://127.0.0.1:8787
    description: Local BoxFleet Workstation Controller & Live Console
tags:
  - name: system
    description: Health, capabilities, provider catalog, and multi-client AI agent mods.
  - name: jobs
    description: Project test/build jobs, autonomous coding workers, and GitHub workflows.
  - name: cloud
    description: BoxFleet White-Label Serverless MicroVM & GPU Cloud (zero idle cost).
  - name: fleet
    description: JackAISaaS Connect accounts, plan tiers, and Business/Enterprise park governance.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Inspect control-plane and native core readiness
      security: []
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/capabilities:
    get:
      operationId: listCapabilities
      tags: [system]
      summary: List BoxFleet capabilities and published job limits
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [implemented, conditional, planned]
      responses:
        '200':
          description: Capability catalog and job limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/providers:
    get:
      operationId: listProviders
      tags: [system]
      summary: List configured local Firecracker and cloud/GPU sandbox providers and templates
      responses:
        '200':
          description: Provider list with runtime templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
  /v1/mods:
    get:
      operationId: describeAgentMods
      tags: [system]
      summary: Inspect installable mods, plugins, hooks, slash commands, subagents, and skills for 9 AI coding clients
      parameters:
        - name: target
          in: query
          required: false
          schema:
            type: string
            enum: [all, claude-code, claude-desktop, codex, agy, gemini-cli, cursor, windsurf, vscode, zed]
      responses:
        '200':
          description: Agent mods catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModsCatalogResponse'
  /v1/inspect:
    post:
      operationId: inspectProject
      tags: [jobs]
      summary: Inspect a project root to detect runtimes, package managers, and test/build commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectProjectRequest'
      responses:
        '200':
          description: Project inspection plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInspectionPlan'
  /v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List sandbox execution jobs with optional status or box filters
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, succeeded, failed, cancelled]
        - name: boxId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Paginated job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
    post:
      operationId: startProjectJob
      tags: [jobs]
      summary: Start an isolated sandbox job for tests, builds, or custom commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProjectJobRequest'
      responses:
        '201':
          description: Job created and started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummary'
  /v1/agent-jobs:
    post:
      operationId: startAgentJob
      tags: [jobs]
      summary: Start an autonomous in-sandbox coding worker using the host model relay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentJobRequest'
      responses:
        '201':
          description: Autonomous coding job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummary'
  /v1/github-jobs:
    post:
      operationId: startGithubJob
      tags: [jobs]
      summary: Clone a GitHub repository in a sandbox and run tests or an autonomous coding task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGithubJobRequest'
      responses:
        '201':
          description: GitHub sandbox job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummary'
  /v1/jobs/{jobId}:
    get:
      operationId: getJobStatus
      tags: [jobs]
      summary: Retrieve current status, exit code, and cleanup receipt of a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummary'
  /v1/jobs/{jobId}/logs:
    get:
      operationId: getJobLogs
      tags: [jobs]
      summary: Read redacted stdout and stderr streams for a sandbox job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Redacted job logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogsResponse'
  /v1/jobs/{jobId}/execution:
    get:
      operationId: getJobExecution
      tags: [jobs]
      summary: Retrieve full execution evidence, model rounds, verification output, and Git patch
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job execution evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobExecutionResponse'
  /v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a running job and trigger immediate sandbox cleanup
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummary'
  /v1/cloud/catalog:
    get:
      operationId: getWhiteLabelCloudCatalog
      tags: [cloud]
      summary: Retrieve BoxFleet White-Label Cloud templates and zero-idle-cost wholesale backends
      security: []
      responses:
        '200':
          description: White-Label Cloud catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhiteLabelCloudCatalog'
  /v1/cloud/boxes:
    get:
      operationId: listCloudBoxes
      tags: [cloud]
      summary: List active and suspended BoxFleet White-Label Cloud boxes for the tenant
      responses:
        '200':
          description: White-label cloud boxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBoxListResponse'
    post:
      operationId: createCloudBox
      tags: [cloud]
      summary: Provision a zero-idle-cost BoxFleet White-Label Cloud VM, GUI desktop, or GPU box
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudBoxRequest'
      responses:
        '201':
          description: Provisioned white-label box
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBoxEnvelope'
  /v1/cloud/boxes/{boxId}/action:
    post:
      operationId: performCloudBoxAction
      tags: [cloud]
      summary: Suspend, resume, wake, publish a port preview URL, stream X11 desktop, snapshot, or terminate a cloud box
      parameters:
        - name: boxId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudBoxActionRequest'
      responses:
        '200':
          description: Cloud box action result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBoxActionResponse'
  /v1/cloud/boxes/{boxId}/vault:
    post:
      operationId: syncCloudBoxVault
      tags: [cloud]
      summary: Mount secret key names into the RAM-backed tmpfs vault (/run/boxfleet/vault) excluded from disk snapshots
      parameters:
        - name: boxId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCloudBoxVaultRequest'
      responses:
        '200':
          description: Vault sync receipt (key names only, zero secret values echoed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCloudBoxVaultResponse'
  /v1/saas/plans:
    get:
      operationId: listSaasPlans
      tags: [fleet]
      summary: List JackAISaaS Connect & BoxFleet subscription plans, quotas, and fleet entitlements
      security: []
      responses:
        '200':
          description: SaaS plan catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasPlansResponse'
  /v1/organizations/{orgId}/fleet:
    get:
      operationId: getOrganizationFleet
      tags: [fleet]
      summary: Inspect the complete Business/Enterprise organization park (boxes, seats, quotas, and policies)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization fleet park overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationFleetResponse'
  /v1/organizations/{orgId}/fleet/policy:
    put:
      operationId: updateOrganizationFleetPolicy
      tags: [fleet]
      summary: Update organization-wide fleet governance policies (allowed providers, quotas, auto-stop, SSO)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetPolicyUpdateRequest'
      responses:
        '200':
          description: Updated fleet policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationFleetResponse'
  /v1/organizations/{orgId}/members:
    get:
      operationId: listOrganizationMembers
      tags: [fleet]
      summary: List organization seats, RBAC roles, and per-user box quotas
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization members list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembersResponse'
    post:
      operationId: upsertOrganizationMember
      tags: [fleet]
      summary: Add or update an organization member seat, RBAC role, and personal box quota
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrganizationMemberRequest'
      responses:
        '200':
          description: Upserted organization member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [ok, service, version]
      properties:
        ok:
          type: boolean
        service:
          type: string
        version:
          type: string
    CapabilitiesResponse:
      type: object
      required: [capabilities, jobLimits]
      properties:
        capabilities:
          type: array
          items:
            type: object
            required: [id, state, summary]
            properties:
              id:
                type: string
              state:
                type: string
              category:
                type: string
              summary:
                type: string
        jobLimits:
          type: object
          additionalProperties: true
    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
              templates:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    runtimes:
                      type: array
                      items:
                        type: string
    ModsCatalogResponse:
      type: object
      required: [schema, summary, targets]
      properties:
        schema:
          type: string
        summary:
          type: object
          properties:
            totalTargets:
              type: integer
            skillsCount:
              type: integer
            mcpPromptsCount:
              type: integer
            mcpResourceTemplatesCount:
              type: integer
        targets:
          type: object
          additionalProperties: true
    InspectProjectRequest:
      type: object
      required: [projectRoot]
      properties:
        projectRoot:
          type: string
        package:
          type: string
    ProjectInspectionPlan:
      type: object
      required: [kind, projectRoot]
      properties:
        kind:
          type: string
        projectRoot:
          type: string
        runtime:
          type: string
        packageManager:
          type: string
        testCommand:
          type: string
        buildCommand:
          type: string
    StartProjectJobRequest:
      type: object
      required: [projectRoot]
      properties:
        projectRoot:
          type: string
        provider:
          type: string
          description: Target provider (firecracker, e2b, lambda, runpod, daytona, boxfleet-cloud, etc.)
        templateId:
          type: string
        action:
          type: string
          enum: [test, build, command]
        command:
          type: string
        install:
          type: boolean
        keepBox:
          type: boolean
        resumeJobId:
          type: string
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
    StartAgentJobRequest:
      type: object
      required: [projectRoot, task]
      properties:
        projectRoot:
          type: string
        task:
          type: string
        provider:
          type: string
        modelBackend:
          type: string
          enum: [claude-cli, codex-cli, anthropic, openai, openrouter, xai, gemini, openai-compatible]
        model:
          type: string
        maxRounds:
          type: integer
          minimum: 1
          maximum: 200
        verificationCommand:
          type: string
    StartGithubJobRequest:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
        ref:
          type: string
        command:
          type: string
        task:
          type: string
        install:
          type: boolean
        push:
          type: boolean
    JobSummary:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        provider:
          type: string
        boxId:
          type: string
        exitCode:
          type: integer
        createdAt:
          type: string
        completedAt:
          type: string
    JobListResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobSummary'
        nextCursor:
          type: string
    JobLogsResponse:
      type: object
      required: [id, stdout, stderr]
      properties:
        id:
          type: string
        stdout:
          type: string
        stderr:
          type: string
    JobExecutionResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
        exitCode:
          type: integer
        patch:
          type: string
        rounds:
          type: array
          items:
            type: object
            additionalProperties: true
    WhiteLabelCloudCatalog:
      type: object
      required: [schema, brand, domain, zeroIdleCostModel, templates, backends]
      properties:
        schema:
          type: string
        brand:
          type: string
        domain:
          type: string
        previewDomainPattern:
          type: string
        zeroIdleCostModel:
          type: object
          properties:
            fixedIdleInfrastructureCostUsd:
              type: number
            billingGranularity:
              type: string
            idleMechanism:
              type: string
        templates:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              gpu:
                type: boolean
        backends:
          type: array
          items:
            type: object
            required: [id, name, isolation]
            properties:
              id:
                type: string
              name:
                type: string
              isolation:
                type: string
              coldBootMs:
                type: integer
              idleComputeUsdPerSecond:
                type: number
              activeVcpuUsdPerSecond:
                type: number
    CreateCloudBoxRequest:
      type: object
      properties:
        name:
          type: string
        templateId:
          type: string
          enum: [boxfleet-universal, boxfleet-desktop, boxfleet-gpu-h100, boxfleet-agent-24x7]
        backend:
          type: string
          enum: [cloudflare-sandbox, fly-machines, e2b, koyeb, beam, modal, molted]
        autoSuspendSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        onTimeout:
          type: string
          enum: [pause, kill]
        vault:
          type: boolean
    CloudBox:
      type: object
      required: [id, boxId, name, provider, templateId, state]
      properties:
        id:
          type: string
        boxId:
          type: string
        name:
          type: string
        provider:
          type: string
        templateId:
          type: string
        state:
          type: string
          enum: [running, paused, suspended, terminated]
        autoSuspendSeconds:
          type: integer
        previewUrlPattern:
          type: string
        desktopStreamUrl:
          type: string
        tmpfsVaultPath:
          type: string
        whiteLabelBroker:
          type: object
          properties:
            backendId:
              type: string
            isolation:
              type: string
            idleCostUsdPerHour:
              type: number
            wholesaleActiveUsdPerHour:
              type: number
            provisioningMode:
              type: string
    CloudBoxEnvelope:
      type: object
      required: [organizationId, box]
      properties:
        organizationId:
          type: string
        box:
          $ref: '#/components/schemas/CloudBox'
    CloudBoxListResponse:
      type: object
      required: [organizationId, provider, boxes]
      properties:
        organizationId:
          type: string
        provider:
          type: string
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/CloudBox'
    CloudBoxActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [suspend, resume, wake, port-publish, desktop-stream, snapshot, terminate]
        port:
          type: integer
          minimum: 1
          maximum: 65535
        viewOnly:
          type: boolean
        name:
          type: string
    CloudBoxActionResponse:
      type: object
      required: [organizationId, boxId, action, state]
      properties:
        organizationId:
          type: string
        boxId:
          type: string
        action:
          type: string
        state:
          type: string
        port:
          type: integer
        url:
          type: string
        snapshotId:
          type: string
    SyncCloudBoxVaultRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: Environment variable names to mount into /run/boxfleet/vault tmpfs at runtime
          items:
            type: string
    SyncCloudBoxVaultResponse:
      type: object
      required: [boxId, mountPath, excludedFromSnapshots, keys]
      properties:
        boxId:
          type: string
        mountPath:
          type: string
        excludedFromSnapshots:
          type: boolean
        keys:
          type: array
          items:
            type: string
    SaasPlansResponse:
      type: object
      required: [product, tiers]
      properties:
        product:
          type: string
        tiers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
              monthlyPriceUsd:
                type: number
    OrganizationFleetResponse:
      type: object
      required: [organizationId, summary, policy, boxes]
      properties:
        organizationId:
          type: string
        summary:
          type: object
          additionalProperties: true
        policy:
          type: object
          additionalProperties: true
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/CloudBox'
    FleetPolicyUpdateRequest:
      type: object
      properties:
        allowedProviders:
          type: array
          items:
            type: string
        maxBoxesPerMember:
          type: integer
        defaultAutoStopMinutes:
          type: integer
        enforceSso:
          type: boolean
        requireSignedSnapshots:
          type: boolean
    OrganizationMember:
      type: object
      required: [userId, email, role]
      properties:
        userId:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, fleet_admin, billing_admin, engineer, viewer]
        maxBoxes:
          type: integer
    OrganizationMembersResponse:
      type: object
      required: [organizationId, members]
      properties:
        organizationId:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'
    UpsertOrganizationMemberRequest:
      type: object
      required: [userId, email, role]
      properties:
        userId:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, fleet_admin, billing_admin, engineer, viewer]
        maxBoxes:
          type: integer
