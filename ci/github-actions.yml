name: OmniWrap complete workspace

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  OMNIWRAP_SOURCE: "boxfleet.openapi.yaml"
  OMNIWRAP_OUTPUT: ".omniwrap-ci"

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      # TODO(pin-sha): verify commit SHA for actions/checkout@v4
      - uses: actions/checkout@v4
      # TODO(pin-sha): verify commit SHA for actions/setup-python@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # TODO(pin-sha): verify commit SHA for actions/setup-node@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned TypeScript
        run: npm install --global typescript@5.9.3
      # TODO(pin-sha): verify commit SHA for actions/setup-java@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
          cache: false
      - name: Check Go race-detector compiler
        run: gcc --version
      - name: Install verified Kotlin compiler
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip" --output "$RUNNER_TEMP/kotlin-compiler-2.0.21.zip"
          printf '0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a  %s\n' "$RUNNER_TEMP/kotlin-compiler-2.0.21.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/kotlin-compiler-2.0.21.zip" -d "$RUNNER_TEMP/omniwrap-kotlin"
          printf "%s\n" "$RUNNER_TEMP/omniwrap-kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      # TODO(pin-sha): verify commit SHA for actions/setup-dotnet@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned Rust
        run: rustup toolchain install 1.86.0 --profile minimal && rustup default 1.86.0
      - name: Install pinned OmniWrap
        run: python -m pip install "omniwrap==2.0.0"
      - name: Doctor (dotnet)
        run: omniwrap doctor --complete --renderer dotnet
      - name: Doctor (go)
        run: omniwrap doctor --complete --renderer go
      - name: Doctor (java)
        run: omniwrap doctor --complete --renderer java
      - name: Doctor (javascript)
        run: omniwrap doctor --complete --renderer javascript
      - name: Doctor (kotlin)
        run: omniwrap doctor --complete --renderer kotlin
      - name: Doctor (python)
        run: omniwrap doctor --complete --renderer python
      - name: Doctor (rust)
        run: omniwrap doctor --complete --renderer rust
      - name: Doctor (typescript)
        run: omniwrap doctor --complete --renderer typescript
      - name: Generate complete workspace
        run: omniwrap create "$OMNIWRAP_SOURCE" --sdk dotnet --sdk go --sdk java --sdk javascript --sdk kotlin --sdk python --sdk rust --sdk typescript --input-kind openapi --mode http_client --complete --verify --replace-existing --no-config --out "$OMNIWRAP_OUTPUT"
      - name: Run generated contract tests
        run: python -m unittest discover -s "$OMNIWRAP_OUTPUT/tests"
